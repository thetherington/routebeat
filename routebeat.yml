################### Routebeat Configuration #########################

############################# Routebeat ######################################

routebeat:
  # Not used on this branch (there is no periodic polling); kept for compatibility with master
  period: 30s

  # (required) Magnum tags of the destinations whose routes are measured
  tags:
    - "MES"
    - "IPAN"

  # (required) Magnum tags of the SLAB physical destinations. Their physical routes fill the
  # bus routing cache (bus -> SLAB device and output) used to find each route's SLAB logs
  physical_route_tags:
    - "SLAB"

  # (required) Nameset whose names are the bus names. Used for destinationLabel / sourceLabel
  # and as the bus routing cache key. "nameset" must match the Magnum nameset name exactly
  mapping:
    nameset: "Broadview"
    # Label used when a terminal has no name in the nameset, or nothing is routed
    default: ""

  # Elasticsearch connection used to read the syslog data (separate from the output below)
  elasticsearch:
    # Elasticsearch server node url (default http://127.0.0.1:9200, the local node)
    address: "http://10.9.0.69:9200"

    # Index pattern holding the Magnum (magrtrsrv) logs (default log-syslog-informational-*)
    # The scheduler, SLAB and magclientsrv index names are fixed in code
    index: "log-syslog-informational-*"

    # (optional) Authentication credentials - either API key or username/password.
    # api_key takes precedence when both are set
    #api_key: "id:api_key"
    #username: "elastic"
    #password: "changeme"

    # (optional) TLS settings for https addresses
    #ssl:
      # PEM encoded CA certificate used to verify the server, in addition to the system CAs
      #ca_cert: "/etc/routebeat/ca.crt"

      # Skip server certificate verification (not recommended)
      #insecure_skip_verify: false

    # false: replace the index pattern wildcard with today's and yesterday's dates (YYYY.MM.dd)
    # true: use the index patterns exactly as written (default false)
    strict: false

    # Wait before analysing a route notification, so its syslog has reached Elasticsearch (default 1m)
    delay: 1m

    # How far the Magnum request log may be from the notification, and how long after the
    # request a SLAB may log (default 45s, must be greater than 0)
    window: 45s

    # When no Magnum request log is within the window, use the oldest unused request log from
    # the last 30 minutes instead (event gets swept: true). Helps when Magnum logs a route
    # without a matching notification (default false)
    sweeping: true

    dev:
      # Use the SLAB logs' ingest time (@timestamp) instead of device.timestamp (default false)
      # use_log_ingest_timestamp: true

      # Read SLAB device.timestamp as New York local time (EST/EDT) and convert it to UTC (default false)
      # swap_slab_log_timezone: true

      # Also search for and link the magclientsrv "Received Dispatch Request." log (default false)
      # magclientsrv_logs: true

  # Magnum API
  api:
    # Magnum GraphQL URL. The subscriptions use the same URL with the wss scheme
    url: "https://129.213.88.5/graphql/v1.1"

    # Open the route and physical route subscriptions. Must be true on this branch (default true)
    notifications: true

    # Not used on this branch (there is no periodic query); kept for compatibility with master
    limit: 2000

    # Magnum OIDC Authentication (client credentials)
    auth:
      client_id: "insite-poller"
      client_secret: "gpJ2WSbjBOD1HoZxpTYGaqKdqeBD1mll"
      token_url: "https://129.213.88.5/auth/realms/magnum/protocol/openid-connect/token"

    # Watchdog: reconnect the subscription after this long without a notification.
    # 0 disables it (default 120m)
    #sub_reconnect_idle: 5m

# ================================== General ===================================

# The name of the shipper that publishes the network data. It can be used to group
# all the transactions sent by a single shipper in the web interface.
#name:

# The tags of the shipper are included in their field with each
# transaction published.
#tags: ["service-X", "web-tier"]

# Optional fields that you can specify to add additional information to the
# output.
#fields:
#  env: staging

# ================================= Dashboards =================================
# These settings control loading the sample dashboards to the Kibana index. Loading
# the dashboards is disabled by default and can be enabled either by setting the
# options here or by using the `setup` command.
#setup.dashboards.enabled: false

# The URL from where to download the dashboard archive. By default, this URL
# has a value that is computed based on the Beat name and version. For released
# versions, this URL points to the dashboard archive on the artifacts.elastic.co
# website.
#setup.dashboards.url:

# =================================== Kibana ===================================

# Starting with Beats version 6.0.0, the dashboards are loaded via the Kibana API.
# This requires a Kibana endpoint configuration.
setup.kibana:

  # Kibana Host
  # Scheme and port can be left out and will be set to the default (http and 5601)
  # In case you specify and additional path, the scheme is required: http://localhost:5601/path
  # IPv6 addresses should always be defined as: https://[2001:db8::1]:5601
  #host: "localhost:5601"

  # Kibana Space ID
  # ID of the Kibana Space into which the dashboards should be loaded. By default,
  # the Default Space will be used.
  #space.id:

# =============================== Elastic Cloud ================================

# These settings simplify using Routebeat with the Elastic Cloud (https://cloud.elastic.co/).

# The cloud.id setting overwrites the `output.elasticsearch.hosts` and
# `setup.kibana.host` options.
# You can find the `cloud.id` in the Elastic Cloud web UI.
#cloud.id:

# The cloud.auth setting overwrites the `output.elasticsearch.username` and
# `output.elasticsearch.password` settings. The format is `<user>:<pass>`.
#cloud.auth:

# ================================== Outputs ===================================

# Configure what output to use when sending the data collected by the beat.

# ---------------------------- Elasticsearch Output ----------------------------
#output.elasticsearch:
  # Array of hosts to connect to.
  #hosts: ["10.9.0.69:9200"]

  # Performance preset - one of "balanced", "throughput", "scale",
  # "latency", or "custom".
  #preset: balanced

  # Protocol - either `http` (default) or `https`.
  #protocol: "https"

  # Authentication credentials - either API key or username/password.
  #api_key: "id:api_key"
  #username: "elastic"
  #password: "changeme"

# ------------------------------ Logstash Output -------------------------------
output.logstash:
  # The Logstash hosts
  hosts: ["10.9.0.69:5057"]

  # Optional SSL. By default is off.
  # List of root certificates for HTTPS server verifications
  #ssl.certificate_authorities: ["/etc/pki/root/ca.pem"]

  # Certificate for SSL client authentication
  #ssl.certificate: "/etc/pki/client/cert.pem"

  # Client Certificate Key
  #ssl.key: "/etc/pki/client/cert.key"

# ================================= Processors =================================

# Configure processors to enhance or manipulate events generated by the beat.

processors:
  - add_host_metadata: ~
  - add_cloud_metadata: ~
  - add_docker_metadata: ~


# ================================== Logging ===================================

# Sets log level. The default log level is info.
# Available log levels are: error, warning, info, debug
#logging.level: debug

# At debug level, you can selectively enable logging only for some components.
# To enable all selectors, use ["*"]. Examples of other selectors are "beat",
# "publisher", "service".
#logging.selectors: ["*"]

# ============================= X-Pack Monitoring ==============================
# Routebeat can export internal metrics to a central Elasticsearch monitoring
# cluster.  This requires xpack monitoring to be enabled in Elasticsearch.  The
# reporting is disabled by default.

# Set to true to enable the monitoring reporter.
#monitoring.enabled: false

# Sets the UUID of the Elasticsearch cluster under which monitoring data for this
# Routebeat instance will appear in the Stack Monitoring UI. If output.elasticsearch
# is enabled, the UUID is derived from the Elasticsearch cluster referenced by output.elasticsearch.
#monitoring.cluster_uuid:

# Uncomment to send the metrics to Elasticsearch. Most settings from the
# Elasticsearch outputs are accepted here as well.
# Note that the settings should point to your Elasticsearch *monitoring* cluster.
# Any setting that is not set is automatically inherited from the Elasticsearch
# output configuration, so if you have the Elasticsearch output configured such
# that it is pointing to your Elasticsearch monitoring cluster, you can simply
# uncomment the following line.
#monitoring.elasticsearch:

# ============================== Instrumentation ===============================

# Instrumentation support for the routebeat.
#instrumentation:
    # Set to true to enable instrumentation of routebeat.
    #enabled: false

    # Environment in which routebeat is running on (eg: staging, production, etc.)
    #environment: ""

    # APM Server hosts to report instrumentation results to.
    #hosts:
    #  - http://localhost:8200

    # API Key for the APM Server(s).
    # If api_key is set then secret_token will be ignored.
    #api_key:

    # Secret token for the APM Server(s).
    #secret_token:


# ================================= Migration ==================================

# This allows to enable 6.7 migration aliases
#migration.6_to_7.enabled: true

