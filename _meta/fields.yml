- key: routebeat
  title: routebeat
  description:
  fields:
    - name: dstId
      type: keyword
      required: false
      description: >
        Magnum Destination ID
    - name: dstName
      type: keyword
      required: false
      description: >
        Magnum Destination Name
    - name: dstIsSub
      type: boolean
      required: false
      description: >
        Magnum Destination Is a Subscription
    - name: dstIsSub
      type: boolean
      required: false
      description: >
        Magnum Destination Is a Destination
    - name: dstType
      type: keyword
      required: false
      description: >
        Magnum Destination Type
    - name: dstTag
      type: keyword
      required: false
      description: >
        Tag value used in GraphQL query
    - name: eventType
      type: keyword
      required: false
      description: >
        Type of event query, notification or log
    - name: destinationLabel
      type: keyword
      required: false
      description: >
        Mapped nameset value for destination
    - name: sourceLabel
      type: keyword
      required: false
      description: >
        Mapped nameset value for source
    - name: dstNameset
      type: object
      required: false
      dynamic: true
      description: >
        Nameset for the destination
    - name: routeableTerminal
      type: object
      required: false
      dynamic: true
      description: >
        Terminal Routeable information
    - name: matched
      type: boolean
      required: false
      description: >
        Indicates if the route is matched with logs
    - name: swept
      type: boolean
      required: false
      description: >
        Indicates if the route is swept with logs
    - name: durationMs
      type: integer
      required: false
      description: >
        Duration between request logs and complete logs in milliseconds
    - name: slab_destinations
      type: group
      fields: 
        - name: Id
          type: keyword
          required: false
          description: >
            UUID of the device
        - name: Device
          type: keyword
          required: false
          description: >
            Magnum Device Name
        - name: Name
          type: keyword
          required: false
          description: >
            Magnum Terminal Name
        - name: Output
          type: integer
          required: false
          description: >
            Device Output
    - name: matchedLogs
      type: group
      fields: 
        - name: time
          type: date
          required: false
          description: >
            Log Date
        - name: log
          type: keyword
          required: false
          description: >
            Log message
        - name: type
          type: keyword
          required: false
          description: >
            Log type, either scheduler, magnum or slab